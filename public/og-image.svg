<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Link2Send – like AirDrop, but everywhere">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(80, 110)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <circle cx="50" cy="50" r="22"/>
    <circle cx="160" cy="50" r="22"/>
    <line x1="72" y1="50" x2="138" y2="50"/>
  </g>

  <text x="80" y="280" fill="#ffffff" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="80" font-weight="700">
    Link2Send
  </text>
  <text x="80" y="350" fill="#e2e8f0" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="40" font-weight="600">
    Like AirDrop — but everywhere.
  </text>
  <text x="80" y="402" fill="#94a3b8" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="26">
    Mac · Windows · iPhone · Android — no cloud, no compression.
  </text>

  <g transform="translate(80, 480)" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#e2e8f0">
    <rect width="170" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="85" y="29" text-anchor="middle">Open source</text>
    <rect x="190" width="100" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="240" y="29" text-anchor="middle">MIT</text>
    <rect x="310" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="420" y="29" text-anchor="middle">TLS 1.3 · mTLS</text>
  </g>
</svg>
